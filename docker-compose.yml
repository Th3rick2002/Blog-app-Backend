services:
  postgres:
    image: postgres:17-alpine
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: user1234
      POSTGRES_PASSWORD: pass1234
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - ./database/init_data.sql:/docker-entrypoint-initdb.d/init_data.sql
    networks:
      - kyxent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user1234 -d blog_db"]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  postgres_data:
    driver: local

networks:
  kyxent-network:
    driver: bridge